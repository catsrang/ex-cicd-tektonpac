apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ex-cicd-tektonpac-ci
spec:
  params:
    - name: repo_url
    - name: revision
    - name: image
      default: ghcr.io/catsrang/demo-app:ci
  workspaces:
    # Scratch space for the whole run; bind to a memory emptyDir. One task
    # (one pod) uses it, so no volume has to be shared between tasks.
    - name: build-mem
  tasks:
    - name: clone-build-image
      taskRef:
        name: clone-build-image-memory
      workspaces:
        - name: build-mem
          workspace: build-mem
      params:
        - name: repo_url
          value: $(params.repo_url)
        - name: revision
          value: $(params.revision)
        - name: image
          value: $(params.image)
