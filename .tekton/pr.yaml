apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ex-cicd-tektonpac-pull-request
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/task: "[git-clone, maven, buildah]"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
    workspaces:
      - name: source
      - name: maven-settings
    tasks:
      - name: fetch-repository
        taskRef:
          name: git-clone
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)

      - name: maven-test
        runAfter: ["fetch-repository"]
        taskRef:
          name: maven
        workspaces:
          - name: source
            workspace: source
          - name: maven-settings
            workspace: maven-settings
        params:
          - name: GOALS
            value: ["test"]

      - name: build-image
        runAfter: ["maven-test"]
        taskRef:
          name: buildah
        workspaces:
          - name: source
            workspace: source
        params:
          - name: IMAGE
            value: "ghcr.io/catsrang/demo-app:pr-{{ pull_request_number }}"
          - name: SKIP_PUSH
            value: "true"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    - name: maven-settings
      emptyDir: {}
