apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ex-cicd-tektonpac-push-main
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/task: "[git-clone, maven, buildah]"
    pipelinesascode.tekton.dev/task-1: "[.tekton/tasks/update-deployment-tag.yaml]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
    workspaces:
      - name: source
      - name: maven-settings
      - name: basic-auth
      - name: dockerconfig
    tasks:
      - name: fetch-repository
        taskRef:
          name: git-clone
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)

      - name: maven-build
        runAfter: ["fetch-repository"]
        taskRef:
          name: maven
        workspaces:
          - name: source
            workspace: source
          - name: maven-settings
            workspace: maven-settings
        params:
          - name: GOALS
            value: ["package"]

      - name: build-and-push-image
        runAfter: ["maven-build"]
        taskRef:
          name: buildah
        workspaces:
          - name: source
            workspace: source
          - name: dockerconfig
            workspace: dockerconfig
        params:
          - name: IMAGE
            value: "ghcr.io/catsrang/demo-app:$(params.revision)"

      - name: update-deployment-tag
        runAfter: ["build-and-push-image"]
        taskRef:
          name: update-deployment-tag
        workspaces:
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: deployment-repo-url
            value: "https://github.com/catsrang/ex-cicd-tektonpac-deploy"
          - name: image-tag
            value: "$(params.revision)"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    - name: maven-settings
      emptyDir: {}
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: dockerconfig
      secret:
        secretName: "ghcr-credentials"
